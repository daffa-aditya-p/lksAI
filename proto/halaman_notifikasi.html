<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifikasi - Aplikasi Tanggap Darurat</title>

    <!-- Google Fonts: Poppins untuk kemiripan tipografi 100% dengan desain Figma -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        navyActive: '#0D1F2D',
                        iconCircleBlue: '#DCEBFA',
                        iconTeal: '#00ACC1',
                        warningAmber: '#FFA800',
                        navTeal: '#15A6B8',
                        subGray: '#8E8E93',
                    },
                    boxShadow: {
                        'pill-active': '0 6px 14px rgba(13, 31, 45, 0.18)',
                        'pill-inactive': '0 2px 6px rgba(0, 0, 0, 0.04)',
                        'notif-card': '0 4px 18px rgba(0, 0, 0, 0.06)',
                        'floating-nav': '0 4px 26px rgba(21, 166, 184, 0.16), 0 2px 10px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FFFFFF;
            -webkit-tap-highlight-color: transparent;
        }

        /* Animasi mikro halus saat button ditekan */
        .btn-interactive {
            transition: all 0.16s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-interactive:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="text-[#1A1A1A] antialiased selection:bg-navTeal selection:text-white min-h-screen flex flex-col justify-between bg-white">

    <!-- CONTAINER UTAMA (Responsif Mobile & Desktop, 100% Murni Sesuai Desain) -->
    <div class="w-full max-w-[480px] lg:max-w-xl mx-auto bg-white min-h-screen flex flex-col justify-between px-6 pt-7 pb-7 relative">

        <!-- BAGIAN ATAS: HEADER, 4 PILL FILTER BUTTONS, & DAFTAR KARTU NOTIFIKASI -->
        <div>
            <!-- 1. HEADER JUDUL & SUBJUDUL -->
            <header class="mb-5">
                <h1 class="text-[28px] font-bold text-[#111111] tracking-tight leading-tight">
                    Notifikasi
                </h1>
                <p class="text-[13.5px] font-normal text-subGray mt-1 leading-snug">
                    Informasi terbaru tentang aktivitas kamu
                </p>
            </header>

            <!-- 2. BARIS 4 FILTER PILL (<button> Semua, Laporan, Relawan, Donasi) -->
            <div class="grid grid-cols-4 gap-2.5 mb-6" role="tablist" aria-label="Filter Kategori Notifikasi">
                <!-- Tab 1: Semua (Default Aktif) -->
                <button type="button" onclick="filterNotifications('semua', this)" role="tab" aria-selected="true" class="filter-pill-btn btn-interactive h-[36px] rounded-full bg-navyActive text-white text-[12.5px] font-medium flex items-center justify-center shadow-pill-active border border-navyActive focus:outline-none">
                    Semua
                </button>

                <!-- Tab 2: Laporan -->
                <button type="button" onclick="filterNotifications('laporan', this)" role="tab" aria-selected="false" class="filter-pill-btn btn-interactive h-[36px] rounded-full bg-white text-[#1E1E1E] hover:border-navyActive text-[12.5px] font-medium flex items-center justify-center shadow-pill-inactive border border-[#C6C6C8] focus:outline-none">
                    Laporan
                </button>

                <!-- Tab 3: Relawan -->
                <button type="button" onclick="filterNotifications('relawan', this)" role="tab" aria-selected="false" class="filter-pill-btn btn-interactive h-[36px] rounded-full bg-white text-[#1E1E1E] hover:border-navyActive text-[12.5px] font-medium flex items-center justify-center shadow-pill-inactive border border-[#C6C6C8] focus:outline-none">
                    Relawan
                </button>

                <!-- Tab 4: Donasi -->
                <button type="button" onclick="filterNotifications('donasi', this)" role="tab" aria-selected="false" class="filter-pill-btn btn-interactive h-[36px] rounded-full bg-white text-[#1E1E1E] hover:border-navyActive text-[12.5px] font-medium flex items-center justify-center shadow-pill-inactive border border-[#C6C6C8] focus:outline-none">
                    Donasi
                </button>
            </div>

            <!-- 3. DAFTAR KARTU NOTIFIKASI (Setiap Kartu Adalah <button> Interaktif) -->
            <section id="notificationList" aria-label="Daftar Notifikasi" class="space-y-4">

                <!-- Card 1: Laporan diperbarui (Tampil di Semua & Laporan) -->
                <button type="button" data-category="laporan" onclick="handleCardClick('Laporan diperbarui (#SATU-00125)')" class="notif-card-item btn-interactive w-full text-left bg-white rounded-[18px] px-4 py-4 shadow-notif-card border border-gray-100/90 hover:border-gray-200 flex items-center gap-4 focus:outline-none focus:ring-2 focus:ring-navTeal">
                    <!-- Lingkaran Biru Muda + Ikon Dokumen Outline Hitam -->
                    <div class="w-[46px] h-[46px] rounded-full bg-iconCircleBlue flex items-center justify-center flex-shrink-0 text-[#1A1A1A]">
                        <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7l-5-5z"/>
                            <path d="M14 2v5h5"/>
                            <line x1="9" y1="13" x2="15" y2="13"/>
                            <line x1="9" y1="17" x2="15" y2="17"/>
                        </svg>
                    </div>

                    <div class="min-w-0 flex-1">
                        <h2 class="text-[15px] font-semibold text-[#1A1A1A] leading-snug">
                            Laporan diperbarui
                        </h2>
                        <p class="text-[12.5px] font-normal text-subGray leading-snug mt-0.5 truncate">
                            Laporan #SATU-00125 sedang diverifikasi
                        </p>
                        <span class="block text-[10px] font-normal text-subGray mt-1">
                            2 Jam lalu
                        </span>
                    </div>
                </button>

                <!-- Card 2: Relawan diterima (Tampil di Semua & Relawan) -->
                <button type="button" data-category="relawan" onclick="handleCardClick('Relawan diterima')" class="notif-card-item btn-interactive w-full text-left bg-white rounded-[18px] px-4 py-4 shadow-notif-card border border-gray-100/90 hover:border-gray-200 flex items-center gap-4 focus:outline-none focus:ring-2 focus:ring-navTeal">
                    <!-- Lingkaran Biru Muda + Ikon 2 Orang Solid Teal -->
                    <div class="w-[46px] h-[46px] rounded-full bg-iconCircleBlue flex items-center justify-center flex-shrink-0 text-iconTeal">
                        <svg class="w-[23px] h-[23px]" viewBox="0 0 24 24" fill="currentColor">
                            <!-- Orang Kiri -->
                            <circle cx="9" cy="8.5" r="3.2"/>
                            <path d="M3.5 18.5c0-2.6 2.5-4.5 5.5-4.5s5.5 1.9 5.5 4.5v.5h-11v-.5z"/>
                            <!-- Orang Kanan -->
                            <circle cx="16.2" cy="9.5" r="2.6"/>
                            <path d="M14.2 19v-.4c0-1.7-.6-3.1-1.7-4.1.9-.3 2-.5 3.2-.5 2.7 0 4.8 1.6 4.8 3.8V19h-6.3z"/>
                        </svg>
                    </div>

                    <div class="min-w-0 flex-1">
                        <h2 class="text-[15px] font-semibold text-[#1A1A1A] leading-snug">
                            Relawan diterima
                        </h2>
                        <p class="text-[12px] font-normal text-subGray leading-snug mt-0.5 truncate">
                            Kamu terdaftar dalam kegiatan relawan
                        </p>
                        <span class="block text-[10px] font-normal text-subGray mt-1">
                            8 Jam lalu
                        </span>
                    </div>
                </button>

                <!-- Card 3: Update donasi (Tampil di Semua & Donasi) -->
                <button type="button" data-category="donasi" onclick="handleCardClick('Update donasi')" class="notif-card-item btn-interactive w-full text-left bg-white rounded-[18px] px-4 py-4 shadow-notif-card border border-gray-100/90 hover:border-gray-200 flex items-center gap-4 focus:outline-none focus:ring-2 focus:ring-navTeal">
                    <!-- Lingkaran Biru Muda + Ikon Kotak Kado Teal -->
                    <div class="w-[46px] h-[46px] rounded-full bg-iconCircleBlue flex items-center justify-center flex-shrink-0 text-iconTeal">
                        <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 12 20 21 4 21 4 12"></polyline>
                            <rect x="2" y="7" width="20" height="5" rx="1"></rect>
                            <line x1="12" y1="21" x2="12" y2="7"></line>
                            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
                            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
                        </svg>
                    </div>

                    <div class="min-w-0 flex-1">
                        <h2 class="text-[15px] font-semibold text-[#1A1A1A] leading-snug">
                            Update donasi
                        </h2>
                        <p class="text-[12.5px] font-normal text-subGray leading-snug mt-0.5 truncate">
                            Donasi kamu telah disalurkan
                        </p>
                        <span class="block text-[10px] font-normal text-subGray mt-1">
                            2 Hari lalu
                        </span>
                    </div>
                </button>

                <!-- Card 4: Situasi Terkini (Tampil di Semua & Laporan sesuai gambar ke-2) -->
                <button type="button" data-category="laporan" onclick="handleCardClick('Situasi Terkini')" class="notif-card-item btn-interactive w-full text-left bg-white rounded-[18px] px-4 py-4 shadow-notif-card border border-gray-100/90 hover:border-gray-200 flex items-center gap-4 focus:outline-none focus:ring-2 focus:ring-navTeal">
                    <!-- Lingkaran Kuning-Oranye Solid + Ikon Segitiga Peringatan Outline Hitam -->
                    <div class="w-[46px] h-[46px] rounded-full bg-warningAmber flex items-center justify-center flex-shrink-0 text-[#1A1A1A]">
                        <svg class="w-[23px] h-[23px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                            <line x1="12" y1="9" x2="12" y2="13"></line>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                    </div>

                    <div class="min-w-0 flex-1">
                        <h2 class="text-[15px] font-semibold text-[#1A1A1A] leading-snug">
                            Situasi Terkini
                        </h2>
                        <p class="text-[11.5px] font-normal text-subGray leading-snug mt-0.5 truncate">
                            Ada pembaruan kondisi darurat di wilayah tertentu
                        </p>
                        <span class="block text-[10px] font-normal text-subGray mt-1">
                            5 Hari lalu
                        </span>
                    </div>
                </button>

            </section>
        </div>

        <!-- 4. FLOATING BOTTOM NAVIGATION BAR (Tab Notifikasi Aktif Teal Sesuai Gambar) -->
        <nav aria-label="Navigasi Bawah" class="mt-20 pt-4">
            <div class="w-full bg-white rounded-[24px] shadow-floating-nav border border-[#E6F4F6] px-4 py-3">
                <div class="grid grid-cols-4 items-center">

                    <!-- Tab 1: Beranda -->
                    <button type="button" onclick="switchBottomTab('Beranda', this)" class="nav-btn btn-interactive flex flex-col items-center justify-center gap-1 text-[#1A1A1A] hover:text-navTeal focus:outline-none">
                        <svg class="w-[24px] h-[24px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 10.5L12 3l9 7.5v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-9z"/>
                            <rect x="9" y="13" width="6" height="8" rx="1"/>
                            <line x1="9" y1="16" x2="15" y2="16"/>
                        </svg>
                        <span class="text-[10.5px] font-normal tracking-tight">
                            Beranda
                        </span>
                    </button>

                    <!-- Tab 2: Aktivitas -->
                    <button type="button" onclick="switchBottomTab('Aktivitas', this)" class="nav-btn btn-interactive flex flex-col items-center justify-center gap-1 text-[#1A1A1A] hover:text-navTeal focus:outline-none">
                        <svg class="w-[24px] h-[24px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="4" width="16" height="17" rx="3"/>
                            <path d="M8 2v4M16 2v4M8 11h8M8 15h5"/>
                        </svg>
                        <span class="text-[10.5px] font-normal tracking-tight">
                            Aktivitas
                        </span>
                    </button>

                    <!-- Tab 3: Notifikasi (Aktif Teal Sesuai Gambar) -->
                    <button type="button" onclick="switchBottomTab('Notifikasi', this)" class="nav-btn btn-interactive flex flex-col items-center justify-center gap-1 text-navTeal focus:outline-none">
                        <svg class="w-[24px] h-[24px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="text-[10.5px] font-medium tracking-tight">
                            Notifikasi
                        </span>
                    </button>

                    <!-- Tab 4: Profil -->
                    <button type="button" onclick="switchBottomTab('Profil', this)" class="nav-btn btn-interactive flex flex-col items-center justify-center gap-1 text-[#1A1A1A] hover:text-navTeal focus:outline-none">
                        <svg class="w-[24px] h-[24px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="7.5" r="3.5"></circle>
                            <path d="M5.5 20a6.5 6.5 0 0 1 13 0"></path>
                            <line x1="4" y1="20" x2="20" y2="20"></line>
                        </svg>
                        <span class="text-[10.5px] font-normal tracking-tight">
                            Profil
                        </span>
                    </button>

                </div>
            </div>
        </nav>

    </div>

    <!-- TOAST FEEDBACK RINGAN (Muncul hanya saat kartu / navigasi diklik) -->
    <div id="toastBanner" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-300 bg-navyActive text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-navTeal"></span>
        <span id="toastText">Notifikasi dipilih</span>
    </div>

    <script>
        /**
         * Filter kartu notifikasi sesuai 4 gambar referensi:
         * - 'semua'   -> Menampilkan semua 4 kartu
         * - 'laporan' -> Menampilkan "Laporan diperbarui" & "Situasi Terkini"
         * - 'relawan' -> Menampilkan "Relawan diterima"
         * - 'donasi'  -> Menampilkan "Update donasi"
         */
        function filterNotifications(category, clickedBtn) {
            // Update tampilan tombol pill aktif vs nonaktif
            const pillButtons = document.querySelectorAll('.filter-pill-btn');
            pillButtons.forEach(btn => {
                btn.setAttribute('aria-selected', 'false');
                btn.classList.remove('bg-navyActive', 'text-white', 'shadow-pill-active', 'border-navyActive');
                btn.classList.add('bg-white', 'text-[#1E1E1E]', 'shadow-pill-inactive', 'border-[#C6C6C8]');
            });

            clickedBtn.setAttribute('aria-selected', 'true');
            clickedBtn.classList.remove('bg-white', 'text-[#1E1E1E]', 'shadow-pill-inactive', 'border-[#C6C6C8]');
            clickedBtn.classList.add('bg-navyActive', 'text-white', 'shadow-pill-active', 'border-navyActive');

            // Filter daftar kartu notifikasi
            const cards = document.querySelectorAll('.notif-card-item');
            cards.forEach(card => {
                const cardCat = card.getAttribute('data-category');
                if (category === 'semua' || cardCat === category) {
                    card.classList.remove('hidden');
                    card.classList.add('flex');
                } else {
                    card.classList.add('hidden');
                    card.classList.remove('flex');
                }
            });
        }

        function handleCardClick(title) {
            showToast(`Membuka detail: ${title}`);
        }

        function switchBottomTab(tabName, clickedBtn) {
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => {
                btn.classList.remove('text-navTeal');
                btn.classList.add('text-[#1A1A1A]');
                const label = btn.querySelector('span');
                if (label) {
                    label.classList.remove('font-medium');
                    label.classList.add('font-normal');
                }
            });

            clickedBtn.classList.remove('text-[#1A1A1A]');
            clickedBtn.classList.add('text-navTeal');
            const activeLabel = clickedBtn.querySelector('span');
            if (activeLabel) {
                activeLabel.classList.remove('font-normal');
                activeLabel.classList.add('font-medium');
            }

            showToast(`Navigasi: ${tabName}`);
        }

        function showToast(message) {
            const banner = document.getElementById('toastBanner');
            const text = document.getElementById('toastText');
            text.textContent = message;
            banner.classList.remove('opacity-0');
            banner.classList.add('opacity-100');

            clearTimeout(window._notifToastTimer);
            window._notifToastTimer = setTimeout(() => {
                banner.classList.remove('opacity-100');
                banner.classList.add('opacity-0');
            }, 2000);
        }
    </script>
</body>
</html>
