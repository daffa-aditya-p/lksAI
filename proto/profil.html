<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Aplikasi Tanggap Darurat</title>

    <!-- Google Fonts: Poppins untuk kemiripan tipografi 100% dengan desain Figma -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        iconGold: '#E5B822',
                        navTeal: '#15A6B8',
                        chevronGray: '#757575',
                    },
                    boxShadow: {
                        'profile-card': '0 4px 22px rgba(0, 0, 0, 0.06)',
                        'menu-card': '0 5px 25px rgba(0, 0, 0, 0.065)',
                        'floating-nav': '0 4px 26px rgba(21, 166, 184, 0.16), 0 2px 10px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FFFFFF;
            -webkit-tap-highlight-color: transparent;
        }

        /* Animasi mikro halus saat button ditekan */
        .btn-interactive {
            transition: all 0.16s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-interactive:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="text-[#1A1A1A] antialiased selection:bg-navTeal selection:text-white min-h-screen flex flex-col justify-between bg-white">

    <!-- CONTAINER UTAMA (Responsif Mobile & Desktop, 100% Murni Sesuai Desain) -->
    <div class="w-full max-w-[480px] lg:max-w-xl mx-auto bg-white min-h-screen flex flex-col justify-between px-6 pt-7 pb-7 relative">

        <!-- BAGIAN ATAS: JUDUL, KARTU USER, & KARTU DAFTAR MENU -->
        <div>
            <!-- 1. HEADER JUDUL "Profil" -->
            <header class="mb-6">
                <h1 class="text-[28px] font-bold text-[#1E1E1E] tracking-tight leading-tight">
                    Profil
                </h1>
            </header>

            <!-- 2. KARTU PROFIL PENGGUNA (James) -->
            <section aria-label="Informasi Akun Pengguna" class="mb-6">
                <div class="w-full bg-white rounded-[20px] p-5 shadow-profile-card border border-gray-100/80 flex items-center gap-5">
                    <!-- Button Lingkaran Avatar Hitam -->
                    <button type="button" onclick="handleProfileClick('Foto Profil James')" aria-label="Ubah Foto Profil" class="btn-interactive w-[64px] h-[64px] rounded-full bg-black flex-shrink-0 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-navTeal"></button>

                    <!-- Nama & Email -->
                    <div class="min-w-0 flex-1">
                        <h2 class="text-[17px] font-bold text-[#1A1A1A] leading-snug truncate">
                            James
                        </h2>
                        <p class="text-[14.5px] font-normal text-[#2B2B2B] leading-snug truncate mt-0.5">
                            jamesmickel@gmail.com
                        </p>
                    </div>
                </div>
            </section>

            <!-- 3. KARTU MENU PROFIL (6 Baris <button> Interaktif) -->
            <section aria-label="Menu Pengaturan dan Riwayat">
                <div class="w-full bg-white rounded-[22px] py-3 px-2 shadow-menu-card border border-gray-100/80 flex flex-col">

                    <!-- Menu 1: Data Diri -->
                    <button type="button" onclick="handleMenuClick('Data Diri')" class="btn-interactive w-full px-4 py-4 rounded-[14px] hover:bg-gray-50/90 flex items-center justify-between text-left group focus:outline-none focus:bg-gray-50">
                        <div class="flex items-center gap-4">
                            <!-- Ikon 2 Orang Kuning Emas -->
                            <span class="w-6 h-6 flex items-center justify-center text-iconGold flex-shrink-0">
                                <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="9" cy="7" r="3.2"/>
                                    <path d="M3.5 19v-1.2A3.8 3.8 0 0 1 7.3 14h3.4a3.8 3.8 0 0 1 3.8 3.8V19"/>
                                    <circle cx="16.5" cy="8" r="2.5"/>
                                    <path d="M14.5 19v-1a3 3 0 0 1 3-3h1a3 3 0 0 1 3 3v1"/>
                                    <line x1="2.5" y1="19" x2="21.5" y2="19"/>
                                </svg>
                            </span>
                            <span class="text-[14.5px] font-normal text-[#1E1E1E]">
                                Data Diri
                            </span>
                        </div>
                        <!-- Panah Kanan (Chevron) -->
                        <svg class="w-[18px] h-[18px] text-chevronGray group-hover:translate-x-0.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>

                    <!-- Menu 2: Riwayat Laporan -->
                    <button type="button" onclick="handleMenuClick('Riwayat Laporan')" class="btn-interactive w-full px-4 py-4 rounded-[14px] hover:bg-gray-50/90 flex items-center justify-between text-left group focus:outline-none focus:bg-gray-50">
                        <div class="flex items-center gap-4">
                            <!-- Ikon Dokumen Ceklis Kuning Emas -->
                            <span class="w-6 h-6 flex items-center justify-center text-iconGold flex-shrink-0">
                                <svg class="w-[21px] h-[21px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h7"/>
                                    <path d="M14 2v6h6"/>
                                    <path d="M16 13V8"/>
                                    <line x1="8" y1="13" x2="12" y2="13"/>
                                    <line x1="8" y1="17" x2="11" y2="17"/>
                                    <polyline points="15 19 17 21 21 17"/>
                                </svg>
                            </span>
                            <span class="text-[14.5px] font-normal text-[#1E1E1E]">
                                Riwayat Laporan
                            </span>
                        </div>
                        <svg class="w-[18px] h-[18px] text-chevronGray group-hover:translate-x-0.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>

                    <!-- Menu 3: Aktivitas Laporan -->
                    <button type="button" onclick="handleMenuClick('Aktivitas Laporan')" class="btn-interactive w-full px-4 py-4 rounded-[14px] hover:bg-gray-50/90 flex items-center justify-between text-left group focus:outline-none focus:bg-gray-50">
                        <div class="flex items-center gap-4">
                            <!-- Ikon 2 Orang Kuning Emas -->
                            <span class="w-6 h-6 flex items-center justify-center text-iconGold flex-shrink-0">
                                <svg class="w-[22px] h-[22px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="9" cy="7" r="3.2"/>
                                    <path d="M3.5 19v-1.2A3.8 3.8 0 0 1 7.3 14h3.4a3.8 3.8 0 0 1 3.8 3.8V19"/>
                                    <circle cx="16.5" cy="8" r="2.5"/>
                                    <path d="M14.5 19v-1a3 3 0 0 1 3-3h1a3 3 0 0 1 3 3v1"/>
                                    <line x1="2.5" y1="19" x2="21.5" y2="19"/>
                                </svg>
                            </span>
                            <span class="text-[14.5px] font-normal text-[#1E1E1E]">
                                Aktivitas Laporan
                            </span>
                        </div>
                        <svg class="w-[18px] h-[18px] text-chevronGray group-hover:translate-x-0.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>

                    <!-- Menu 4: Riwayat Donasi -->
                    <button type="button" onclick="handleMenuClick('Riwayat Donasi')" class="btn-interactive w-full px-4 py-4 rounded-[14px] hover:bg-gray-50/90 flex items-center justify-between text-left group focus:outline-none focus:bg-gray-50">
                        <div class="flex items-center gap-4">
                            <!-- Ikon Kotak Hadiah / Donasi Kuning Emas -->
                            <span class="w-6 h-6 flex items-center justify-center text-iconGold flex-shrink-0">
                                <svg class="w-[21px] h-[21px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 12 20 22 4 22 4 12"></polyline>
                                    <rect x="2" y="7" width="20" height="5"></rect>
                                    <line x1="12" y1="22" x2="12" y2="7"></line>
                                    <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
                                    <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
                                </svg>
                            </span>
                            <span class="text-[14.5px] font-normal text-[#1E1E1E]">
                                Riwayat Donasi
                            </span>
                        </div>
                        <svg class="w-[18px] h-[18px] text-chevronGray group-hover:translate-x-0.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>

                    <!-- Menu 5: Bantuan & Panduan -->
                    <button type="button" onclick="handleMenuClick('Bantuan & Panduan')" class="btn-interactive w-full px-4 py-4 rounded-[14px] hover:bg-gray-50/90 flex items-center justify-between text-left group focus:outline-none focus:bg-gray-50">
                        <div class="flex items-center gap-4">
                            <!-- Ikon Tanda Tanya Lingkaran Kuning Emas -->
                            <span class="w-6 h-6 flex items-center justify-center text-iconGold flex-shrink-0">
                                <svg class="w-[21px] h-[21px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="9.5"></circle>
                                    <path d="M9.2 9a2.8 2.8 0 0 1 5.4 1c0 1.9-2.6 2.6-2.6 2.6"></path>
                                    <line x1="12" y1="16.8" x2="12.01" y2="16.8"></line>
                                </svg>
                            </span>
                            <span class="text-[14.5px] font-normal text-[#1E1E1E]">
                                Bantuan &amp; Panduan
                            </span>
                        </div>
                        <svg class="w-[18px] h-[18px] text-chevronGray group-hover:translate-x-0.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>

                    <!-- Menu 6: Pengaturan -->
                    <button type="button" onclick="handleMenuClick('Pengaturan')" class="btn-interactive w-full px-4 py-4 rounded-[14px] hover:bg-gray-50/90 flex items-center justify-between text-left group focus:outline-none focus:bg-gray-50">
                        <div class="flex items-center gap-4">
                            <!-- Ikon Roda Gigi (Gear) Kuning Emas -->
                            <span class="w-6 h-6 flex items-center justify-center text-iconGold flex-shrink-0">
                                <svg class="w-[21px] h-[21px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="3"></circle>
                                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                                </svg>
                            </span>
                            <span class="text-[14.5px] font-normal text-[#1E1E1E]">
                                Pengaturan
                            </span>
                        </div>
                        <svg class="w-[18px] h-[18px] text-chevronGray group-hover:translate-x-0.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>

                </div>
            </section>
        </div>

        <!-- 4. FLOATING BOTTOM NAVIGATION BAR (Mengambang dengan Glow Cyan Lembut Sesuai Gambar) -->
        <nav aria-label="Navigasi Bawah" class="mt-24 pt-4">
            <div class="w-full bg-white rounded-[24px] shadow-floating-nav border border-[#E6F4F6] px-4 py-3">
                <div class="grid grid-cols-4 items-center">

                    <!-- Tab 1: Beranda -->
                    <button type="button" onclick="switchBottomTab('Beranda', this)" class="nav-btn btn-interactive flex flex-col items-center justify-center gap-1 text-[#1A1A1A] hover:text-navTeal focus:outline-none">
                        <svg class="w-[24px] h-[24px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 10.5L12 3l9 7.5v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-9z"/>
                            <rect x="9" y="13" width="6" height="8" rx="1"/>
                            <line x1="9" y1="16" x2="15" y2="16"/>
                        </svg>
                        <span class="text-[10.5px] font-normal tracking-tight">
                            Beranda
                        </span>
                    </button>

                    <!-- Tab 2: Aktivitas -->
                    <button type="button" onclick="switchBottomTab('Aktivitas', this)" class="nav-btn btn-interactive flex flex-col items-center justify-center gap-1 text-[#1A1A1A] hover:text-navTeal focus:outline-none">
                        <svg class="w-[24px] h-[24px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="4" width="16" height="17" rx="3"/>
                            <path d="M8 2v4M16 2v4M8 11h8M8 15h5"/>
                        </svg>
                        <span class="text-[10.5px] font-normal tracking-tight">
                            Aktivitas
                        </span>
                    </button>

                    <!-- Tab 3: Notifikasi -->
                    <button type="button" onclick="switchBottomTab('Notifikasi', this)" class="nav-btn btn-interactive flex flex-col items-center justify-center gap-1 text-[#1A1A1A] hover:text-navTeal focus:outline-none">
                        <svg class="w-[24px] h-[24px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="text-[10.5px] font-normal tracking-tight">
                            Notifikasi
                        </span>
                    </button>

                    <!-- Tab 4: Profil (Aktif Teal Sesuai Gambar) -->
                    <button type="button" onclick="switchBottomTab('Profil', this)" class="nav-btn btn-interactive flex flex-col items-center justify-center gap-1 text-navTeal focus:outline-none">
                        <svg class="w-[24px] h-[24px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="7.5" r="3.5"></circle>
                            <path d="M5.5 20a6.5 6.5 0 0 1 13 0"></path>
                            <line x1="4" y1="20" x2="20" y2="20"></line>
                        </svg>
                        <span class="text-[10.5px] font-medium tracking-tight">
                            Profil
                        </span>
                    </button>

                </div>
            </div>
        </nav>

    </div>

    <!-- TOAST FEEDBACK RINGAN (Muncul hanya saat tombol diklik) -->
    <div id="toastBanner" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-opacity duration-300 bg-[#1A1A1A] text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-navTeal"></span>
        <span id="toastText">Menu dipilih</span>
    </div>

    <script>
        function handleMenuClick(menuName) {
            showToast(`Membuka halaman ${menuName}`);
        }

        function handleProfileClick(target) {
            showToast(`Membuka ${target}`);
        }

        function switchBottomTab(tabName, clickedBtn) {
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => {
                btn.classList.remove('text-navTeal');
                btn.classList.add('text-[#1A1A1A]');
                const label = btn.querySelector('span');
                if (label) {
                    label.classList.remove('font-medium');
                    label.classList.add('font-normal');
                }
            });

            clickedBtn.classList.remove('text-[#1A1A1A]');
            clickedBtn.classList.add('text-navTeal');
            const activeLabel = clickedBtn.querySelector('span');
            if (activeLabel) {
                activeLabel.classList.remove('font-normal');
                activeLabel.classList.add('font-medium');
            }

            showToast(`Navigasi: ${tabName}`);
        }

        function showToast(message) {
            const banner = document.getElementById('toastBanner');
            const text = document.getElementById('toastText');
            text.textContent = message;
            banner.classList.remove('opacity-0');
            banner.classList.add('opacity-100');

            clearTimeout(window._profileToastTimer);
            window._profileToastTimer = setTimeout(() => {
                banner.classList.remove('opacity-100');
                banner.classList.add('opacity-0');
            }, 2000);
        }
    </script>
</body>
</html>
